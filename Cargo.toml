[package]
name = "listeners"
version = "0.6.1"
edition = "2024"
authors = ["Giuliano Bellini <gyulyvgc99@gmail.com>"]
description = "Cross-platform library to find out processes listening on network ports"
readme = "README.md"
repository = "https://github.com/GyulyVGC/listeners"
license = "MIT"
keywords = ["listen", "port", "process", "socket", "pid"]
categories = ["network-programming"]
include = ["src/**/*", "LICENSE", "README.md", "CHANGELOG.md", "examples/**/*", "build.rs"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper"
] }

[target.'cfg(target_os = "macos")'.dependencies]
byteorder = "1.5"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = {version = "1.1", features = ["fs"]}

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.build-dependencies]
cc = "1.4"

[dev-dependencies]
http-test-server = "2.1.1"
serial_test = "4.0.1"
criterion = "0.8.2"
serde_json = "1.0.151"
rand = "0.10.2"

[[bench]]
name = "get_all"
harness = false

[[bench]]
name = "get_process_by_active_port"
harness = false

[[bench]]
name = "get_process_by_inactive_port"
harness = false

[[bin]]
name = "spawn_process"
path = "benches/spawn_process/src/main.rs"
